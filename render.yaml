databases:
  - name: fleetflow-db
    databaseName: tms_db
    user: tms_user
    plan: free

services:
  # Backend API
  - type: web
    name: fleetflow-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/migrate.js --seed && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: fleetflow-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 7d
      - key: BCRYPT_COST
        value: "12"
      - key: CORS_ORIGIN
        value: "*"

  # Frontend Static Web App
  - type: web
    name: fleetflow-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: fleetflow-backend
          property: host
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: fleetflow-backend
          property: host
